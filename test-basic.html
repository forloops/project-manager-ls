<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Functionality Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ccc; }
        .success { color: green; }
        .error { color: red; }
        .info { color: blue; }
    </style>
</head>
<body>
    <h1>Product Manager LS - Basic Functionality Test</h1>
    
    <div id="test-results"></div>
    
    <script src="src/storage/storage.js"></script>
    <script src="src/storage/models.js"></script>
    <script src="src/sprints/sprint-manager.js"></script>
    
    <script>
        // Test runner
        function runTests() {
            const results = document.getElementById('test-results');
            let testsPassed = 0;
            let testsTotal = 0;
            
            function addResult(testName, success, message) {
                testsTotal++;
                if (success) testsPassed++;
                
                const div = document.createElement('div');
                div.className = 'test-section';
                div.innerHTML = `
                    <h3 class="${success ? 'success' : 'error'}">${success ? '✓' : '✗'} ${testName}</h3>
                    <p class="${success ? 'success' : 'error'}">${message}</p>
                `;
                results.appendChild(div);
            }
            
            // Test 1: Storage Manager
            try {
                const storage = window.storageManager;
                const isAvailable = storage.isStorageAvailable();
                addResult('Storage Manager', isAvailable, 
                    isAvailable ? 'Local storage is available and working' : 'Local storage not available');
            } catch (error) {
                addResult('Storage Manager', false, `Error: ${error.message}`);
            }
            
            // Test 2: Sprint Model
            try {
                const sprintData = {
                    name: 'Test Sprint',
                    startDate: '2024-01-01',
                    duration: 2,
                    type: 'Development'
                };
                
                const sprint = new SprintModel(sprintData);
                sprint.endDate = SprintModel.calculateEndDate(sprint.startDate, sprint.duration);
                const validation = sprint.validate();
                
                addResult('Sprint Model', validation.isValid, 
                    validation.isValid ? 'Sprint model validation passed' : `Validation errors: ${validation.errors.join(', ')}`);
            } catch (error) {
                addResult('Sprint Model', false, `Error: ${error.message}`);
            }
            
            // Test 3: Sprint Manager
            try {
                const manager = window.sprintManager;
                const initialCount = manager.getAllSprints().length;
                
                const result = manager.createSprint({
                    name: 'Test Sprint ' + Date.now(),
                    startDate: '2024-01-01',
                    duration: 2,
                    type: 'Development'
                });
                
                addResult('Sprint Manager', result.success, 
                    result.success ? 'Sprint created successfully' : `Error: ${result.errors.join(', ')}`);
                
                // Clean up test sprint
                if (result.success) {
                    manager.deleteSprint(result.sprint.id);
                }
            } catch (error) {
                addResult('Sprint Manager', false, `Error: ${error.message}`);
            }
            
            // Test 4: Data Persistence
            try {
                const testData = { test: 'value', timestamp: Date.now() };
                const storage = window.storageManager;
                
                // Save test data
                const saved = storage.saveData(testData);
                
                // Retrieve test data
                const retrieved = storage.getData();
                const matches = retrieved && retrieved.test === testData.test;
                
                addResult('Data Persistence', saved && matches, 
                    saved && matches ? 'Data persistence working correctly' : 'Data persistence failed');
            } catch (error) {
                addResult('Data Persistence', false, `Error: ${error.message}`);
            }
            
            // Test 5: Date Calculations
            try {
                const startDate = '2024-01-01';
                const endDate2Week = SprintModel.calculateEndDate(startDate, 2);
                const endDate3Week = SprintModel.calculateEndDate(startDate, 3);
                
                const expected2Week = '2024-01-14';
                const expected3Week = '2024-01-21';
                
                const correct = endDate2Week === expected2Week && endDate3Week === expected3Week;
                
                addResult('Date Calculations', correct, 
                    correct ? 'Date calculations working correctly' : 
                    `Expected: ${expected2Week}, ${expected3Week}. Got: ${endDate2Week}, ${endDate3Week}`);
            } catch (error) {
                addResult('Date Calculations', false, `Error: ${error.message}`);
            }
            
            // Summary
            const summary = document.createElement('div');
            summary.className = 'test-section';
            summary.style.backgroundColor = testsPassed === testsTotal ? '#e8f5e8' : '#ffe8e8';
            summary.innerHTML = `
                <h2>Test Summary</h2>
                <p><strong>${testsPassed}/${testsTotal} tests passed</strong></p>
                <p class="info">
                    ${testsPassed === testsTotal ? 
                        'All tests passed! The application is ready to use.' : 
                        'Some tests failed. Check the issues above.'}
                </p>
            `;
            results.appendChild(summary);
        }
        
        // Run tests when page loads
        document.addEventListener('DOMContentLoaded', runTests);
    </script>
</body>
</html>
