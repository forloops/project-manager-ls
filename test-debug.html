<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Sprint Creation Issue</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ccc; }
        .success { color: green; }
        .error { color: red; }
        .info { color: blue; }
        pre { background: #f5f5f5; padding: 10px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>Debug Sprint Creation Issue</h1>
    
    <div id="test-results"></div>
    
    <script src="src/storage/storage.js"></script>
    <script src="src/storage/models.js"></script>
    <script src="src/sprints/sprint-manager.js"></script>
    
    <script>
        function addResult(testName, success, message, details = null) {
            const results = document.getElementById('test-results');
            const div = document.createElement('div');
            div.className = 'test-section';
            div.innerHTML = `
                <h3 class="${success ? 'success' : 'error'}">${success ? '✓' : '✗'} ${testName}</h3>
                <p class="${success ? 'success' : 'error'}">${message}</p>
                ${details ? `<pre class="info">${details}</pre>` : ''}
            `;
            results.appendChild(div);
        }

        function debugTests() {
            console.log('=== DEBUGGING SPRINT CREATION ===');
            
            // Test 1: Check if all dependencies are loaded
            addResult('Dependencies Check', 
                typeof window.storageManager !== 'undefined' && 
                typeof window.SprintModel !== 'undefined' && 
                typeof window.sprintManager !== 'undefined',
                'All required objects available'
            );
            
            // Test 2: Check storage initialization
            try {
                const storage = window.storageManager;
                const data = storage.getData();
                addResult('Storage Data Structure', 
                    data && Array.isArray(data.sprints), 
                    `Data structure: ${JSON.stringify(data, null, 2)}`,
                    JSON.stringify(data, null, 2)
                );
            } catch (error) {
                addResult('Storage Data Structure', false, `Storage error: ${error.message}`);
            }
            
            // Test 3: Test SprintModel directly
            try {
                const sprintData = {
                    name: 'Test Sprint',
                    startDate: '2024-01-01',
                    duration: 2,
                    type: 'Development'
                };
                
                console.log('Creating SprintModel with data:', sprintData);
                const sprint = new SprintModel(sprintData);
                console.log('SprintModel created:', sprint);
                
                // Calculate end date
                if (sprint.startDate && sprint.duration && !sprint.endDate) {
                    sprint.endDate = SprintModel.calculateEndDate(sprint.startDate, sprint.duration);
                    console.log('End date calculated:', sprint.endDate);
                }
                
                const validation = sprint.validate();
                console.log('Validation result:', validation);
                
                addResult('SprintModel Creation', 
                    validation.isValid, 
                    validation.isValid ? 'Sprint model valid' : `Validation errors: ${validation.errors.join(', ')}`,
                    JSON.stringify({
                        sprintData: sprintData,
                        sprint: sprint.toJSON(),
                        validation: validation
                    }, null, 2)
                );
            } catch (error) {
                addResult('SprintModel Creation', false, `SprintModel error: ${error.message}`, error.stack);
            }
            
            // Test 4: Test SprintManager directly
            try {
                const manager = window.sprintManager;
                console.log('SprintManager instance:', manager);
                
                const sprintData = {
                    name: 'Manager Test Sprint',
                    startDate: '2024-01-01',
                    duration: 2,
                    type: 'Development'
                };
                
                console.log('Calling createSprint with data:', sprintData);
                const result = manager.createSprint(sprintData);
                console.log('CreateSprint result:', result);
                
                addResult('SprintManager Creation', 
                    result.success, 
                    result.success ? 'Sprint created successfully' : `Creation failed: ${result.errors?.join(', ')}`,
                    JSON.stringify(result, null, 2)
                );
                
                // If successful, test retrieval
                if (result.success) {
                    const allSprints = manager.getAllSprints();
                    addResult('Sprint Retrieval After Creation', 
                        allSprints.length > 0, 
                        `Retrieved ${allSprints.length} sprints`,
                        JSON.stringify(allSprints.map(s => s.toJSON()), null, 2)
                    );
                }
                
            } catch (error) {
                addResult('SprintManager Creation', false, `SprintManager error: ${error.message}`, error.stack);
            }
            
            // Test 5: Check storage after operations
            try {
                const storage = window.storageManager;
                const finalData = storage.getData();
                addResult('Final Storage State', 
                    finalData && Array.isArray(finalData.sprints), 
                    `Final data contains ${finalData.sprints.length} sprints`,
                    JSON.stringify(finalData, null, 2)
                );
            } catch (error) {
                addResult('Final Storage State', false, `Final storage error: ${error.message}`);
            }
        }
        
        // Run debug tests when page loads
        document.addEventListener('DOMContentLoaded', debugTests);
    </script>
</body>
</html>
